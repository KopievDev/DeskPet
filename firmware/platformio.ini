[platformio]
default_envs = tdisplay_s3

[env:tdisplay_s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200

; ESP32-S3R8: 16 MB flash, OPI PSRAM
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLILYGO_LGFX_USE_T_DISPLAY_S3

; The official board profile contains the ST7789 parallel pins,
; display power-enable pin and PWM backlight setup.
lib_deps =
    https://github.com/Xinyuan-LILYGO/LilyGo-display-library.git
