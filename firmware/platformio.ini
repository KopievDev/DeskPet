[platformio]
default_envs = tdisplay_s3

[env:tdisplay_s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200

; ESP32-S3R8: 16 MB flash, OPI PSRAM
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; LovyanGFX 1.2.33: ESP32-S3 Bus_Parallel8 uses cfg.port, not cfg.i2s_port.
; LCD pin map is kept in include/DeskPetTDisplayS3.h (based on LILYGO profile).
; Pin the version for reproducible local builds.
lib_deps =
    lovyan03/LovyanGFX @ 1.2.33
